version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign

issues:
  exclude-rules:
    # Pre-existing: selectedStyle in TUI kept for future use
    - linters: [unused]
      source: "selectedStyle"
    # Pre-existing: ineffassign in crypto tests
    - path: "age_test\\.go"
      linters: [ineffassign]
